version: 0.9.8

# Optional anchor date (CST) for backtests.
# - If null/blank: src.run anchors to CURRENT session.
# - If set (YYYY-MM-DD): RR at session start uses ONLY prior sessions; once today's OR is ready, RR automatically includes it (include_today_or=1).
asof_date_cst: null

db:
  path: "./data/db/orb_core.sqlite"

timezone: "America/Chicago"

session:
  start: "08:30"
  end: "23:00"
  calendar: "NYSE"

symbols:
  mode: "list"          # list | single | csv
  single: "AAPL"
  list: ["SPY", "AAPL", "NVDA","TSLA  ","MSFT","AMZN","GOOGL","META ","UNH","JNJ ","V","PG","MA","DIS","HD","BAC","XOM","VZ","ADBE"]
  csv_path: "./data/symbols.csv"

market_data:
  opening_range_minutes: 30
  interval: "15m"
  lookback_days: [3, 5, 9]


replay:
  enabled: true
  tag_replay_alerts: true

discord:
  enabled: true
  webhook_url: "https://discord.com/api/webhooks/1470675055301230798/js4udu-E9PgYobVifVfa5LnnBE-wguJyV59Q2jdpIiPob8zy16iiDKlws_O4KsAov2Qg"
  templates_path: "./templates/discord_alerts.yaml"
