
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-ref"
version = "1.1.1"
description = "ORB reference range analytics (Steps 4-5 combined)"
requires-python = ">=3.10"
dependencies = [
  "pyyaml",
  "exchange-calendars",
  "pandas",
  "yfinance",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
