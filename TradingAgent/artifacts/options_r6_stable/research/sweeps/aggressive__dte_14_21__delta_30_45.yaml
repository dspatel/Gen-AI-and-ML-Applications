version: 0.1.0
status: design_only
db:
  path: ./artifacts/options_r6_stable/options_r6_core.sqlite
paths:
  research_output_dir: ./artifacts/options_r6_stable/research
  reports_dir: ./artifacts/options_r6_stable/reports
timezone: America/Chicago
session:
  start: 08:30
  end: '15:00'
  calendar: NYSE
symbols:
  csv_path: ./options_r6_stable/config/symbols.csv
underlying_signal:
