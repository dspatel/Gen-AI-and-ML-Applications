[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobapp-agent"
version = "0.1.0"
description = "Local job discovery and guided application copilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.49.0",
  "PyYAML>=6.0.1",
  "pypdf>=6.0.0",
  "requests>=2.32.0",
]

[project.scripts]
jobapp-agent = "jobapp_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
